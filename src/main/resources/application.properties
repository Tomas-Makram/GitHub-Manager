spring.application.name=myGithub-Manager

# GitHub OAuth2 Registration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri=${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/github
logging.level.org.springframework.security=${LOG_LEVEL:WARN}
spring.security.oauth2.client.registration.github.scope=read:user,repo,delete_repo
spring.security.oauth2.client.registration.github.client-authentication-method=client_secret_basic

# GitHub Provider Details
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Logging
spring.thymeleaf.cache=true

# Multipart & Tomcat Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1024MB
server.tomcat.max-part-count=-1
server.tomcat.max-http-form-post-size=524288000
server.tomcat.max-swallow-size=524288000
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=__Host-GITHUB_MGR_SESSION

# Cache
spring.cache.type=caffeine